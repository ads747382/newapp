name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties && yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build debug APK
        run: |
          set -o pipefail
          if ! gradle :app:assembleDebug --no-daemon 2>&1 | tee build.log; then
            grep -E "^e: |error:|What went wrong|Could not|> " build.log | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: PersonalSmsGateway-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: android/app/build/outputs/apk/debug/app-debug.apk

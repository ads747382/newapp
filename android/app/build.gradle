plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'io.github.ads747382.smsgateway'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.ads747382.smsgateway'
        minSdk 26
        targetSdk 32
        versionCode 3
        versionName '1.0.0'
    }

    // Signing: release builds use your own key from environment variables (GitHub secrets) when set.
    // Otherwise both build types fall back to the shared test key in this folder, so new APKs
    // install over old ones. Anyone can sign with the shared key, so use your own key for real use.
    signingConfigs {
        shared {
            storeFile file('shared-test.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            def ks = System.getenv('SIGNING_KEYSTORE_PATH')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('SIGNING_STORE_PASSWORD')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASSWORD')
            } else {
                storeFile file('shared-test.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-ktx:1.10.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
